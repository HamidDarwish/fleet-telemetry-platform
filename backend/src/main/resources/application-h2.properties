# Embedded H2 database (profile "h2"): no installation, no Docker.
# Data is kept in the file backend/data/fleetdb.mv.db and survives restarts.
# To start from zero: stop the backend and delete the folder backend/data
spring.datasource.url=jdbc:h2:file:./data/fleetdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
