# ---------- Database profile ----------
# h2         = embedded file database, nothing to install (default, no Docker needed)
# (empty)    = PostgreSQL below (start it with database/docker-compose.yml or install it yourself)
# To use PostgreSQL: delete the next line or leave it empty.
spring.profiles.active=h2

# ---------- Server ----------
server.port=8080

# ---------- Database: PostgreSQL (used when the h2 profile is NOT active) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/fleetdb
spring.datasource.username=fleet
spring.datasource.password=fleet123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Security (JWT) ----------
# Secret must be at least 32 characters. Change it for anything beyond local development.
fleet.jwt.secret=change-this-secret-key-to-at-least-32-characters-long
fleet.jwt.expiration-hours=12

# ---------- Simulator (SIM-1 .. SIM-8) ----------
fleet.simulator.auto-start=true
fleet.simulator.vehicle-count=10
fleet.simulator.interval-ms=3000
# Time acceleration: 5 means vehicles cover 5x the real distance per tick
# (so odometer and maintenance changes are visible during a demo)
fleet.simulator.speed-multiplier=5
fleet.simulator.fault-probability=0.01

# ---------- Alert thresholds (Appendix B of the SRS) ----------
fleet.alert.cooldown-seconds=300
fleet.alert.overheat-warning=105
fleet.alert.overheat-critical=115
fleet.alert.overspeed=100
fleet.alert.low-fuel=15

# ---------- Other ----------
fleet.vehicle.offline-seconds=60
fleet.telemetry.retention-days=30
fleet.maintenance.proactive-percent=90
