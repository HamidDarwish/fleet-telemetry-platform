# PostgreSQL for the Fleet Telemetry Platform (local development)
# Start:  docker compose up -d      Stop: docker compose down
services:
  postgres:
    image: postgres:16
    container_name: fleet-postgres
    environment:
      POSTGRES_DB: fleetdb
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet123
    ports:
      - "5432:5432"
    volumes:
      - fleet_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  fleet_pgdata:
